name: Portfolio CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint & Next.js Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies cleanly
        run: npm ci

      - name: Run ESLint checks
        run: npm run lint

      - name: Build Next.js production bundle
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build

  docker-image:
    name: Verify Multi-Stage Docker Build
    runs-on: ubuntu-latest
    needs: lint-and-build
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production container image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: shivam-devops-portfolio:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
